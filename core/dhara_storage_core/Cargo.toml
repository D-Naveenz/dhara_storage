[package]
name = "dhara_storage_core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Framework crate for Dhara Storage — DSFD, process primitives, and portable types for the runtime."
readme = "README.md"
documentation = "https://docs.rs/dhara_storage_core"
keywords = ["storage", "framework", "flatbuffers", "definitions", "dhara"]
categories = ["encoding", "filesystem"]

[lib]
crate-type = ["rlib"]

[dependencies]
crossbeam-channel = "0.5"
flatbuffers = "25.12.19"
quick-xml = { version = "0.42.0", features = ["serialize"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"

[versions]
workspace = "0.10.0"

[product]
authors = ["Naveen Dharmathunga"]
repository_url = "https://github.com/D-Naveenz/dhara_storage"
project_url = "https://github.com/D-Naveenz/dhara_storage"
license = "Apache-2.0"

[nuget]
source = "https://api.nuget.org/v3/index.json"

[ci]
smoke_project = "bindings/csharp/Dhara.Storage.ConsumerSmoke/Dhara.Storage.ConsumerSmoke.csproj"
package_project = "bindings/csharp/Dhara.Storage/Dhara.Storage.csproj"
managed_package_projects = [
    "bindings/csharp/Dhara.Storage.Extensions.Hosting/Dhara.Storage.Extensions.Hosting.csproj",
]
tests_project = "bindings/csharp/Dhara.Storage.Tests/Dhara.Storage.Tests.csproj"
native_runtimes = [
    "win-x64",
    "win-arm64",
    "linux-x64",
    "linux-arm64",
    "osx-arm64",
]
# Daemon transport is cross-platform (named pipes on Windows, UDS on Linux/macOS).
host_runtime_smoke = "linux-x64"
aot_runtime_smoke = "linux-x64"

[targets.rust_targets]
linux-arm64 = "aarch64-unknown-linux-gnu"
linux-x64 = "x86_64-unknown-linux-gnu"
osx-arm64 = "aarch64-apple-darwin"
win-arm64 = "aarch64-pc-windows-msvc"
win-x64 = "x86_64-pc-windows-msvc"

[workspace]
members = [
    "core/dhara_storage_core",
    "core/dhara_storage",
    "interop/dharastorage-ffi",
    "interop/dhara-sd",
]
resolver = "3"

[workspace.package]
version = "0.10.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/D-Naveenz/dhara_storage"
homepage = "https://github.com/D-Naveenz/dhara_storage"
authors = ["Naveen Dharmathunga"]

[workspace.dependencies]
dhara_storage_core = { version = "0.10.0", path = "core/dhara_storage_core" }
dhara_storage = { version = "0.10.0", path = "core/dhara_storage" }

# Single release profile for CI native staging, local `stage-native`, and NuGet-bound `dhara-sd`.
# opt-level 3 favors daemon / analysis speed over Ratatui-style size-first `"s"`.
# thin LTO keeps multi-RID release links usable locally and in Package Pipeline (five 64-bit RIDs);
# panic=abort + strip shrink the sidecar without a second profile.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

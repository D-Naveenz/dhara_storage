[package]
name = "dhara_storage_core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "DSFD definition-package framework for Dhara Storage (schema, model, encode/decode)."
readme = "README.md"
documentation = "https://docs.rs/dhara_storage_core"
keywords = ["flatbuffers", "storage", "definitions", "dsfd", "dhara"]
categories = ["encoding", "filesystem"]

[lib]
crate-type = ["rlib"]

[dependencies]
flatbuffers = "25.12.19"
quick-xml = { version = "0.41.0", features = ["serialize"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"

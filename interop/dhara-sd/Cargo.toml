[package]
name = "dhara-sd"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors = ["Naveen Dharmathunga"]
description = "Dhara Storage daemon — gRPC control plane with OS handle transfer for foreign-language bindings."
publish = false

[[bin]]
name = "dhara-sd"
path = "src/main.rs"

[package.metadata.winresource]
ProductName = "Dhara Storage"
FileDescription = "Dhara Storage sidecar daemon"
OriginalFilename = "dhara-sd.exe"
LegalCopyright = "Copyright © 2026 Naveen Dharmathunga"
CompanyName = "Naveen Dharmathunga"

[dependencies]
dhara_storage = { workspace = true, features = ["async-tokio"] }
tokio = { version = "1.53", features = ["full"] }
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
futures = "0.3"
async-stream = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
uuid = { version = "1.25", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["socket", "uio", "signal", "process"] }

[build-dependencies]
tonic-prost-build = "0.14"
protoc-bin-vendored = "3.2"
winresource = "0.1"

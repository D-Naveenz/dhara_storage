syntax = "proto3";

package dhara.pilot.v1;

option csharp_namespace = "Dhara.Storage.Pilot.V1";

/// Binding-transport pilot service for FFI vs daemon benchmarks.
service DharaPilot {
  /// Empty round-trip for IPC floor measurement.
  rpc Ping(PingRequest) returns (PingResponse);

  /// Echo arbitrary bytes to measure protobuf + pipe serialization cost.
  rpc Echo(EchoRequest) returns (EchoResponse);

  /// Register the host process for subsequent handle duplication.
  rpc Handshake(HandshakeRequest) returns (HandshakeResponse);

  rpc GetFileInfo(GetFileInfoRequest) returns (GetFileInfoResponse);
  rpc ListEntries(ListEntriesRequest) returns (ListEntriesResponse);
  rpc AnalyzePath(AnalyzePathRequest) returns (AnalyzePathResponse);

  /// Full-file bytes over gRPC (intentionally expensive for large files).
  rpc ReadFileBytes(ReadFileBytesRequest) returns (ReadFileBytesResponse);

  /// Windows: open in daemon, DuplicateHandle into the handshake parent, return handle value.
  rpc OpenReadHandle(OpenReadHandleRequest) returns (OpenReadHandleResponse);

  rpc WriteFileBytes(WriteFileBytesRequest) returns (WriteFileBytesResponse);

  /// Copy with server-streaming progress updates.
  rpc CopyFile(CopyFileRequest) returns (stream CopyFileProgress);

  /// Debounced directory change events as a persistent stream.
  rpc WatchDirectory(WatchDirectoryRequest) returns (stream WatchEvent);

  /// Synthetic ProcessingQueue stub — assigns a job id without real work.
  rpc EnqueueWork(EnqueueWorkRequest) returns (EnqueueWorkResponse);

  /// Synthetic work-event stream for future StorageProcess / ProcessingQueue groundwork.
  rpc StreamWorkEvents(StreamWorkEventsRequest) returns (stream WorkEvent);
}

message PingRequest {}

message PingResponse {
  int64 unix_millis = 1;
}

message EchoRequest {
  bytes payload = 1;
}

message EchoResponse {
  bytes payload = 1;
}

message HandshakeRequest {
  uint32 parent_pid = 1;
  uint32 protocol_version = 2;
}

message HandshakeResponse {
  uint32 protocol_version = 1;
  string pipe_name = 2;
}

message GetFileInfoRequest {
  string path = 1;
}

message GetFileInfoResponse {
  string path = 1;
  string name = 2;
  uint64 size = 3;
  optional string extension = 4;
  bool is_read_only = 5;
}

message ListEntriesRequest {
  string path = 1;
}

message ListEntriesResponse {
  repeated EntryInfo entries = 1;
}

message EntryInfo {
  string path = 1;
  string name = 2;
  bool is_directory = 3;
}

message AnalyzePathRequest {
  string path = 1;
}

message AnalyzePathResponse {
  optional string top_mime_type = 1;
  optional string top_detected_extension = 2;
  uint32 content_kind = 3;
  uint64 bytes_scanned = 4;
  uint64 file_size = 5;
  repeated DetectedMatch matches = 6;
}

message DetectedMatch {
  string file_type_label = 1;
  string mime_type = 2;
  double confidence = 3;
  uint64 score = 4;
}

message ReadFileBytesRequest {
  string path = 1;
}

message ReadFileBytesResponse {
  bytes data = 1;
}

message OpenReadHandleRequest {
  string path = 1;
}

message OpenReadHandleResponse {
  uint64 handle = 1;
  uint64 size = 2;
}

message WriteFileBytesRequest {
  string path = 1;
  bytes data = 2;
  bool overwrite = 3;
  bool create_parent_directories = 4;
}

message WriteFileBytesResponse {
  string path = 1;
  uint64 bytes_written = 2;
}

message CopyFileRequest {
  string source = 1;
  string destination = 2;
  bool overwrite = 3;
}

message CopyFileProgress {
  uint64 bytes_transferred = 1;
  optional uint64 total_bytes = 2;
  double bytes_per_second = 3;
  bool completed = 4;
  optional string destination = 5;
  optional string error_message = 6;
}

message WatchDirectoryRequest {
  string path = 1;
  bool recursive = 2;
  uint32 debounce_window_ms = 3;
}

message WatchEvent {
  uint32 change_type = 1;
  string path = 2;
  optional string previous_path = 3;
  int64 observed_unix_millis = 4;
}

message EnqueueWorkRequest {
  string kind = 1;
  string path = 2;
}

message EnqueueWorkResponse {
  string job_id = 1;
}

message StreamWorkEventsRequest {
  /// When empty, stream events for all jobs created by this session.
  repeated string job_ids = 1;
  /// How many synthetic completion events to emit (bench helper).
  uint32 synthetic_count = 2;
}

message WorkEvent {
  string job_id = 1;
  string state = 2;
  int64 unix_millis = 3;
}

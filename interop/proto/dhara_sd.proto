syntax = "proto3";

package dhara.sd.v1;

option csharp_namespace = "Dhara.Storage.Sd.V1";

/// Dhara Storage daemon service (gRPC control plane; data plane uses handle transfer).
service DharaSd {
  rpc Ping(PingRequest) returns (PingResponse);
  rpc Echo(EchoRequest) returns (EchoResponse);
  rpc Handshake(HandshakeRequest) returns (HandshakeResponse);

  rpc GetFileMetadata(GetFileMetadataRequest) returns (GetFileMetadataResponse);
  rpc GetDirectoryMetadata(GetDirectoryMetadataRequest) returns (GetDirectoryMetadataResponse);
  rpc ListEntries(ListEntriesRequest) returns (ListEntriesResponse);
  rpc AnalyzePath(AnalyzePathRequest) returns (AnalyzePathResponse);

  /// Windows: open for read, DuplicateHandle into the handshake parent.
  rpc OpenReadHandle(OpenReadHandleRequest) returns (OpenReadHandleResponse);
  /// Windows: create/open for write, DuplicateHandle into the handshake parent.
  rpc OpenWriteHandle(OpenWriteHandleRequest) returns (OpenWriteHandleResponse);

  rpc CreateDirectory(CreateDirectoryRequest) returns (CreateDirectoryResponse);
  rpc DeletePath(DeletePathRequest) returns (DeletePathResponse);
  rpc MovePath(MovePathRequest) returns (MovePathResponse);
  rpc RenamePath(RenamePathRequest) returns (RenamePathResponse);

  rpc CopyFile(CopyFileRequest) returns (stream StorageProcessEventMessage);
  rpc CopyDirectory(CopyDirectoryRequest) returns (stream StorageProcessEventMessage);

  rpc WatchDirectory(WatchDirectoryRequest) returns (stream WatchEvent);

  /// Bench-only contrast: full-file bytes over gRPC (not the product data plane).
  rpc ReadFileBytes(ReadFileBytesRequest) returns (ReadFileBytesResponse);
  rpc WriteFileBytes(WriteFileBytesRequest) returns (WriteFileBytesResponse);

  rpc EnqueueWork(EnqueueWorkRequest) returns (EnqueueWorkResponse);
  rpc StreamWorkEvents(StreamWorkEventsRequest) returns (stream WorkEvent);
}

message PingRequest {}
message PingResponse { int64 unix_millis = 1; }

message EchoRequest { bytes payload = 1; }
message EchoResponse { bytes payload = 1; }

message HandshakeRequest {
  uint32 parent_pid = 1;
  uint32 protocol_version = 2;
}
message HandshakeResponse {
  uint32 protocol_version = 1;
  string pipe_name = 2;
  string fd_pass_endpoint = 3;
}

message ShellIconPayload {
  uint32 width = 1;
  uint32 height = 2;
  bytes rgba_pixels = 3;
}

message StorageSizePayload {
  uint64 bytes = 1;
  string formatted = 2;
}

message StorageAttributesPayload {
  bool read_only = 1;
  bool hidden = 2;
  bool system = 3;
}

message StoragePermissionsPayload {
  bool can_read = 1;
  bool can_write = 2;
  bool can_modify = 3;
  bool can_execute = 4;
}

message StorageTypePayload {
  string name = 1;
  optional string mime_type = 2;
}

message FileExtensionPayload {
  optional string source = 1;
  optional string detected = 2;
  string display = 3;
}

message GetFileMetadataRequest {
  string path = 1;
  bool include_icon = 2;
  uint32 icon_size = 3;
  bool include_analysis = 4;
}
message GetFileMetadataResponse {
  string absolute_path = 1;
  optional string relative_path = 2;
  string name = 3;
  StorageSizePayload size = 5;
  StorageAttributesPayload attributes = 6;
  StoragePermissionsPayload permissions = 7;
  bool is_symbolic_link = 8;
  optional string link_target = 9;
  bool is_temporary = 10;
  optional int64 created_at_unix_ms = 11;
  optional int64 modified_at_unix_ms = 12;
  optional int64 accessed_at_unix_ms = 13;
  StorageTypePayload file_type = 14;
  FileExtensionPayload extension = 15;
  optional ShellIconPayload icon = 16;
  optional AnalyzePathResponse analysis = 17;
}

message GetDirectoryMetadataRequest {
  string path = 1;
  bool include_icon = 2;
  uint32 icon_size = 3;
  bool include_summary = 4;
}
message GetDirectoryMetadataResponse {
  string absolute_path = 1;
  optional string relative_path = 2;
  string name = 3;
  bool exists = 5;
  StorageAttributesPayload attributes = 6;
  StoragePermissionsPayload permissions = 7;
  bool is_symbolic_link = 8;
  optional string link_target = 9;
  bool is_temporary = 10;
  optional int64 created_at_unix_ms = 11;
  optional int64 modified_at_unix_ms = 12;
  optional int64 accessed_at_unix_ms = 13;
  string type_name = 14;
  optional StorageSizePayload size = 15;
  optional uint64 file_count = 16;
  optional uint64 directory_count = 17;
  optional ShellIconPayload icon = 18;
}

message ListEntriesRequest {
  string path = 1;
  bool recursive = 2;
}
message ListEntriesResponse { repeated EntryInfo entries = 1; }
message EntryInfo {
  string path = 1;
  string name = 2;
  bool is_directory = 3;
}

message AnalyzePathRequest { string path = 1; }
message AnalyzePathResponse {
  optional string top_mime_type = 1;
  optional string top_detected_extension = 2;
  uint32 content_kind = 3;
  uint64 bytes_scanned = 4;
  uint64 file_size = 5;
  repeated DetectedMatch matches = 6;
}
message DetectedMatch {
  string file_type_label = 1;
  string mime_type = 2;
  double confidence = 3;
  uint64 score = 4;
}

enum ShareMode {
  SHARE_MODE_UNSPECIFIED = 0;
  SHARED = 1;
  EXCLUSIVE = 2;
}

message OpenReadHandleRequest {
  string path = 1;
  ShareMode share_mode = 2;
  // Milliseconds to wait on sharing/busy; 0 means fail immediately.
  uint32 lock_timeout_ms = 3;
}
message OpenReadHandleResponse {
  uint64 handle = 1;
  uint64 size = 2;
}

message OpenWriteHandleRequest {
  string path = 1;
  bool overwrite = 2;
  bool create_parent_directories = 3;
  ShareMode share_mode = 4;
  // Milliseconds to wait on sharing/busy; 0 means fail immediately.
  uint32 lock_timeout_ms = 5;
}
message OpenWriteHandleResponse {
  uint64 handle = 1;
}

message CreateDirectoryRequest {
  string path = 1;
  bool create_parents = 2;
}
message CreateDirectoryResponse { string path = 1; }

message DeletePathRequest {
  string path = 1;
  bool recursive = 2;
}
message DeletePathResponse {}

message MovePathRequest {
  string source = 1;
  string destination = 2;
  bool overwrite = 3;
}
message MovePathResponse { string path = 1; }

message RenamePathRequest {
  string path = 1;
  string new_name = 2;
  bool overwrite = 3;
}
message RenamePathResponse { string path = 1; }

message CopyFileRequest {
  string source = 1;
  string destination = 2;
  bool overwrite = 3;
}
message CopyDirectoryRequest {
  string source = 1;
  string destination = 2;
  bool overwrite = 3;
}

message ProcessStarted {
  uint64 total_bytes = 1;
  uint64 total_files = 2;
}
message ProcessCurrentItem {
  string path = 1;
  uint64 file_size = 2;
  uint64 file_index = 3;
}
message ProcessBytes {
  uint64 bytes_transferred = 1;
}
message ProcessCompleted {
  optional string destination = 1;
}
message ProcessFailed {
  string message = 1;
}
message ProcessCancelled {
  string operation = 1;
}

/// Windows-copy-dialog style process event stream for copy operations.
message StorageProcessEventMessage {
  oneof kind {
    ProcessStarted started = 1;
    ProcessCurrentItem current_item = 2;
    ProcessBytes bytes = 3;
    ProcessCompleted completed = 4;
    ProcessFailed failed = 5;
    ProcessCancelled cancelled = 6;
  }
}

message WatchDirectoryRequest {
  string path = 1;
  bool recursive = 2;
  uint32 debounce_window_ms = 3;
}
message WatchEvent {
  uint32 change_type = 1;
  string path = 2;
  optional string previous_path = 3;
  int64 observed_unix_millis = 4;
}

message ReadFileBytesRequest { string path = 1; }
message ReadFileBytesResponse { bytes data = 1; }

message WriteFileBytesRequest {
  string path = 1;
  bytes data = 2;
  bool overwrite = 3;
  bool create_parent_directories = 4;
}
message WriteFileBytesResponse {
  string path = 1;
  uint64 bytes_written = 2;
}

message EnqueueWorkRequest {
  string kind = 1;
  string path = 2;
}
message EnqueueWorkResponse { string job_id = 1; }

message StreamWorkEventsRequest {
  repeated string job_ids = 1;
  uint32 synthetic_count = 2;
}
message WorkEvent {
  string job_id = 1;
  string state = 2;
  int64 unix_millis = 3;
}


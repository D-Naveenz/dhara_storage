name: publish-nuget

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate NuGet release without publishing
        required: true
        default: false
        type: boolean
      verify_package:
        description: Re-run full verify package on dry-run
        required: true
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always
  DOTNET_CLI_HOME: ${{ github.workspace }}/.dotnet

permissions:
  contents: read

concurrency:
  group: publish-nuget-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-changes:
    name: detect nuget scope
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        if: github.event_name == 'push'
        id: filter
        with:
          filters: |
            nuget_scope:
              - 'core/**'
              - 'interop/**'
              - 'bindings/**'
              - 'dhara.config.toml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/publish-nuget.yml'
      - name: Resolve scope
        id: check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=${{ steps.filter.outputs.nuget_scope }}" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: nuget release (linux)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    environment: release-nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Resolve PR CI artifact commit
        id: artifact-commit
        shell: bash
        run: |
          set -euo pipefail
          merge_sha="${{ github.sha }}"
          artifact_sha=""
          if git rev-parse --verify "${merge_sha}^2" >/dev/null 2>&1; then
            artifact_sha="$(git rev-parse "${merge_sha}^2")"
            echo "Using merge second parent ${artifact_sha} for PR CI artifacts."
          elif [ "${{ github.event_name }}" = "push" ] && [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            before="${{ github.event.before }}"
            if git rev-parse --verify "${before}^2" >/dev/null 2>&1; then
              artifact_sha="$(git rev-parse "${before}^2")"
              echo "Using second parent ${artifact_sha} of previous main tip ${before} for PR CI artifacts."
            fi
          fi
          if [ -z "${artifact_sha}" ]; then
            artifact_sha="${merge_sha}"
            echo "Using push commit ${artifact_sha} for artifacts."
          fi
          echo "sha=${artifact_sha}" >> "${GITHUB_OUTPUT}"

      - name: Download PR CI native stage
        id: native-artifact
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v21
        with:
          workflow: pipeline.yml
          commit: ${{ steps.artifact-commit.outputs.sha }}
          workflow_conclusion: success
          name: release-native-stage
          path: target/dist/artifacts/native-stage

      - name: Download NuGet package artifact
        id: nupkg-artifact
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v21
        with:
          workflow: pipeline.yml
          commit: ${{ steps.artifact-commit.outputs.sha }}
          workflow_conclusion: success
          name: release-nuget-package
          path: target/dist/output/nuget

      - name: Require PR CI artifacts
        shell: bash
        run: |
          set -euo pipefail
          if [ -d target/dist/artifacts/native-stage/runtimes ] && compgen -G "target/dist/output/nuget/*.nupkg" > /dev/null; then
            exit 0
          fi
          echo "::error::No PR CI artifacts found for commit ${{ steps.artifact-commit.outputs.sha }} (merge ${{ github.sha }}). Ensure NuGet package (linux) succeeded on the merged PR branch tip before release. Squash merges are not supported for pre-packed CD."
          exit 1

      - name: Resolve pre-packed NuGet packages
        id: nupkg
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(target/dist/output/nuget/*.nupkg)
          filtered=()
          for p in "${packages[@]}"; do
            case "$p" in
              *.symbols.nupkg) continue ;;
              *) filtered+=("$p") ;;
            esac
          done
          if [ "${#filtered[@]}" -eq 0 ]; then
            echo "::error::NuGet package artifact was not downloaded."
            exit 1
          fi
          # Lexicographic order puts Dhara.Storage before Dhara.Storage.Extensions.Hosting.
          IFS=$'\n' sorted=($(printf '%s\n' "${filtered[@]}" | sort))
          unset IFS
          echo "packages<<EOF" >> "${GITHUB_OUTPUT}"
          printf '%s\n' "${sorted[@]}" >> "${GITHUB_OUTPUT}"
          echo "EOF" >> "${GITHUB_OUTPUT}"
          echo "count=${#sorted[@]}" >> "${GITHUB_OUTPUT}"
          printf 'Resolved %s package(s):\n' "${#sorted[@]}"
          printf '  %s\n' "${sorted[@]}"

      - name: NuGet login (OIDC)
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
        continue-on-error: true
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish NuGet packages
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
        shell: bash
        env:
          OIDC_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          FALLBACK_API_KEY: ${{ secrets.NUGET_API_KEY }}
          NUPKG_LIST: ${{ steps.nupkg.outputs.packages }}
          NUGET_SOURCE: ${{ vars.NUGET_SOURCE }}
        run: |
          set -euo pipefail

          source="${NUGET_SOURCE:-}"
          if [ -z "$source" ]; then
            source=$(grep -E '^\s*source\s*=' dhara.config.toml | head -1 | sed -E 's/.*=\s*"([^"]+)".*/\1/')
          fi

          is_duplicate_output() {
            grep -qiE \
              'already exists|conflict \(409\)|409 \(conflict\)|the feed and package already exists|conflict' \
              <<<"$1"
          }

          # Returns 0 success, 2 already published, 1 other failure.
          try_push() {
            local key="$1"
            local label="$2"
            local nupkg="$3"
            local out code
            echo "Attempting NuGet push of $(basename "$nupkg") via ${label}..."
            set +e
            out=$(dotnet nuget push "$nupkg" \
              --api-key "$key" \
              --source "$source" \
              2>&1)
            code=$?
            set -e
            printf '%s\n' "$out"
            if [ "$code" -eq 0 ]; then
              echo "::notice::NuGet publish of $(basename "$nupkg") succeeded via ${label}."
              return 0
            fi
            if is_duplicate_output "$out"; then
              echo "::notice::$(basename "$nupkg") already live on the feed (${label})."
              return 2
            fi
            echo "::warning::NuGet push of $(basename "$nupkg") via ${label} failed (exit ${code})."
            return 1
          }

          push_one() {
            local nupkg="$1"
            if [ -n "${OIDC_API_KEY:-}" ]; then
              if try_push "$OIDC_API_KEY" "OIDC Trusted Publishing" "$nupkg"; then
                return 0
              else
                rc=$?
                if [ "$rc" -eq 2 ]; then
                  return 0
                fi
                echo "::warning::OIDC publish failed for $(basename "$nupkg") (Trusted Publishing may be misconfigured). Falling back to API key."
              fi
            else
              echo "::warning::OIDC login did not produce an API key. Falling back to API key."
            fi

            if [ -z "${FALLBACK_API_KEY:-}" ]; then
              echo "::error::NUGET_API_KEY is not set on environment release-nuget; cannot fall back from OIDC."
              return 1
            fi

            if try_push "$FALLBACK_API_KEY" "API key" "$nupkg"; then
              return 0
            else
              rc=$?
              if [ "$rc" -eq 2 ]; then
                return 0
              fi
              echo "::error::NuGet publish of $(basename "$nupkg") failed via API key."
              return 1
            fi
          }

          mapfile -t packages <<< "$NUPKG_LIST"
          if [ "${#packages[@]}" -eq 0 ] || [ -z "${packages[0]:-}" ]; then
            echo "::error::No NuGet packages resolved for publish."
            exit 1
          fi

          failed=0
          for nupkg in "${packages[@]}"; do
            [ -n "$nupkg" ] || continue
            if ! push_one "$nupkg"; then
              failed=1
            fi
          done
          exit "$failed"

      - name: Dry-run validation
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        shell: bash
        env:
          NUPKG_LIST: ${{ steps.nupkg.outputs.packages }}
        run: |
          set -euo pipefail
          echo "Dry run: validated ${{ steps.nupkg.outputs.count }} pre-packed NuGet package(s):"
          printf '%s\n' "$NUPKG_LIST"

      - name: Upload NuGet artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: |
            target/dist/output/nuget/*.nupkg
            target/dist/output/nuget/*.snupkg
            target/dist/output/nuget/*.symbols.nupkg

            done | sha256_file | awk '{print substr($1, 1, 16)}'
          )
          echo "hash=${hash}" >> "${GITHUB_OUTPUT}"

      - name: Restore dhara_tool cache
        id: tool-cache
        uses: actions/cache/restore@v4
        with:
          path: target/dist
          key: dhara-tool-${{ steps.tool-hash.outputs.hash }}-linux-x64

      - name: Setup Linux tool build dependencies
        if: steps.tool-cache.outputs.cache-hit != 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_tool_rebuild)
        uses: ./.github/actions/setup-linux-tool-deps

      - name: Build dhara_tool on cache miss
        if: steps.tool-cache.outputs.cache-hit != 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_tool_rebuild)
        run: cargo build -p dhara_tool --profile dist

      - name: Save dhara_tool cache
        if: steps.tool-cache.outputs.cache-hit != 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_tool_rebuild)
        uses: actions/cache/save@v4
        with:
          path: target/dist
          key: dhara-tool-${{ steps.tool-hash.outputs.hash }}-linux-x64

      - name: Download native stages
        uses: actions/download-artifact@v4
        with:
          pattern: native-stage-*
          path: target/dist/artifacts/native-inputs
          merge-multiple: false

      - name: Merge native stages
        shell: bash
        run: |
          set -euo pipefail
          output="target/dist/artifacts/native-stage"
          rm -rf "$output"
          mkdir -p "$output/runtimes"
          for stage in \
            target/dist/artifacts/native-inputs/native-stage-windows \
            target/dist/artifacts/native-inputs/native-stage-linux \
            target/dist/artifacts/native-inputs/native-stage-linux-arm64 \
            target/dist/artifacts/native-inputs/native-stage-macos
          do
            if [ ! -d "$stage/runtimes" ]; then
              echo "::error::missing runtimes in $stage"
              exit 1
            fi
            for rid_dir in "$stage/runtimes"/*; do
              [ -d "$rid_dir" ] || continue
              rid="$(basename "$rid_dir")"
              mkdir -p "$output/runtimes/$rid"
              cp -a "$rid_dir/." "$output/runtimes/$rid/"
            done
          done

      - name: Verify package
        shell: bash
        run: |
          set -euo pipefail
          target/dist/dhara_tool -r "$GITHUB_WORKSPACE" --yes verify package

      - name: Write release metadata
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep -E '^\s*workspace\s*=' dhara.config.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          printf '{"version":"%s","commit":"%s"}\n' "$version" "${{ github.sha }}" > target/dist/artifacts/release-metadata.json

      - name: Upload release native stage
        uses: actions/upload-artifact@v4
        with:
          name: release-native-stage
          path: target/dist/artifacts/native-stage
          retention-days: 90

      - name: Upload release NuGet package
        uses: actions/upload-artifact@v4
        with:
          name: release-nuget-package
          path: |
            target/dist/output/nuget/*.nupkg
            target/dist/output/nuget/*.snupkg
            target/dist/output/nuget/*.symbols.nupkg
          retention-days: 90

      - name: Upload release metadata
        uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: target/dist/artifacts/release-metadata.json
          retention-days: 90

name: Pipeline

on:
  pull_request:
  workflow_dispatch:
    inputs:
      force_tool_rebuild:
        description: Rebuild dhara_tool dist binaries even when cache exists
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always
  DOTNET_CLI_HOME: ${{ github.workspace }}/.dotnet

permissions:
  contents: write

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: code quality (linux)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Quality checks
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt -p dhara_storage_dal -p dhara_storage -p dharastorage-ffi -p dhara_tool --check
          cargo clippy -p dhara_storage --all-targets --all-features -- -D warnings
          cargo clippy -p dhara_storage_dal -p dharastorage-ffi --all-targets -- -D warnings
          cargo doc -p dhara_storage --no-deps --all-features
          cargo doc --no-deps -p dhara_storage_dal -p dharastorage-ffi

  platform-windows:
    name: platform (windows)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: quality
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: aarch64-pc-windows-msvc

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Compute dhara_tool source hash
        id: tool-hash
        shell: bash
        run: |
          set -euo pipefail
          sha256_file() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$@"
            else
              shasum -a 256 "$@"
            fi
          }
          hash=$(
            {
              git ls-files 'tooling/dhara_tool'
              git ls-files 'Cargo.toml' 'Cargo.lock'
            } | sort -u | while read -r file; do
              [ -f "$file" ] && sha256_file "$file"
            done | sha256_file | awk '{print substr($1, 1, 16)}'
          )
          echo "hash=${hash}" >> "${GITHUB_OUTPUT}"

      - name: Restore dhara_tool cache
        id: tool-cache
        uses: actions/cache/restore@v4
        with:
          path: target/dist
          key: dhara-tool-${{ steps.tool-hash.outputs.hash }}-windows-x64

      - name: Build dhara_tool on cache miss
        if: steps.tool-cache.outputs.cache-hit != 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_tool_rebuild)
        run: cargo build -p dhara_tool --profile dist

      - name: Save dhara_tool cache
        if: steps.tool-cache.outputs.cache-hit != 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_tool_rebuild)
        uses: actions/cache/save@v4
        with:
          path: target/dist
          key: dhara-tool-${{ steps.tool-hash.outputs.hash }}-windows-x64

      - name: Rust tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p dhara_storage --all-features
          cargo test -p dhara_storage_dal
          cargo test -p dharastorage-ffi

      - name: .NET tests
        shell: bash
        run: |
          set -euo pipefail
          tests_project=$(grep -E '^\s*tests_project\s*=' dhara.config.toml | head -1 | sed -E 's/.*=\s*"([^"]+)".*/\1/')
          dotnet test "$tests_project"

      - name: Stage native assets
        shell: bash
        run: |
          set -euo pipefail
          target/dist/dhara_tool.exe -r "$GITHUB_WORKSPACE" --yes package stage-native --msvc-env

      - name: Upload native stage
        uses: actions/upload-artifact@v4
        with:
          name: native-stage-windows
          path: target/dist/artifacts/native-stage

  platform-linux:
    name: platform (linux)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Compute dhara_tool source hash
        id: tool-hash
        shell: bash
        run: |
          set -euo pipefail
          sha256_file() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$@"
            else
              shasum -a 256 "$@"
            fi

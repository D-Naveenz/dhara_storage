      - name: Stage native assets
        shell: bash
        run: |
          set -euo pipefail
          stage_root="target/dist/artifacts/native-stage"
          rid=osx-arm64
          target=aarch64-apple-darwin
          lib=libdharastorage.dylib
          cargo build -p dharastorage-ffi --release --target "$target"
          dest="$stage_root/runtimes/$rid/native/$lib"
          mkdir -p "$(dirname "$dest")"
          cp "target/$target/release/$lib" "$dest"

      - name: Upload native stage
        uses: actions/upload-artifact@v4
        with:
          name: native-stage-macos
          path: target/dist/artifacts/native-stage

  nuget-package:
    name: NuGet package (linux)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: [platform-windows, platform-linux, platform-linux-arm64, platform-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Compute dhara_tool source hash
        id: tool-hash
        shell: bash
        run: |
          set -euo pipefail
          sha256_file() {

name: Pipeline

on:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  DOTNET_CLI_HOME: ${{ github.workspace }}/.dotnet

permissions:
  contents: write

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: code quality (linux)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true
          submodules: true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Setup Linux GUI dependencies
        uses: ./.github/actions/setup-linux-tool-deps

      - name: Quality checks
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt -p dhara_storage_core -p dhara_storage -p dharastorage-ffi -p dhara-sd --check
          cargo clippy -p dhara_storage --all-targets --all-features -- -D warnings
          cargo clippy -p dhara_storage_core -p dharastorage-ffi -p dhara-sd --all-targets -- -D warnings
          cargo doc -p dhara_storage --no-deps --all-features
          cargo doc --no-deps -p dhara_storage_core -p dharastorage-ffi -p dhara-sd

  platform-windows:
    name: platform (windows)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: quality
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true
          submodules: true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: aarch64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Download DROT
        uses: ./.github/actions/download-drot
        with:
          artifact_name: drot-windows-x64
          github_token: ${{ secrets.DROT_ARTIFACTS_TOKEN }}

      - name: Stage native assets
        shell: bash
        run: |
          set -euo pipefail
          target/dist/drot.exe -r "$GITHUB_WORKSPACE" --yes package stage-native --msvc-env

      - name: Upload native stage
        uses: actions/upload-artifact@v7
        with:
          name: native-stage-windows
          path: target/dist/artifacts/native-stage

  platform-linux:
    name: platform (linux)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true
          submodules: true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Setup Linux GUI dependencies
        uses: ./.github/actions/setup-linux-tool-deps

      - name: Rust tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p dhara_storage --all-features
          cargo test -p dhara_storage_core
          cargo test -p dharastorage-ffi
          cargo build -p dhara-sd --release

      - name: .NET tests
        shell: bash
        run: |
          set -euo pipefail
          tests_project=$(grep -E '^\s*tests_project\s*=' dhara.config.toml | head -1 | sed -E 's/.*=\s*"([^"]+)".*/\1/')
          xvfb-run -a dotnet test "$tests_project" -c Release

      - name: Stage native assets
        shell: bash
        run: |
          set -euo pipefail
          stage_root="target/dist/artifacts/native-stage"
          rid=linux-x64
          target=x86_64-unknown-linux-gnu
          bin=dhara-sd
          cargo build -p dhara-sd --release --target "$target"
          dest="$stage_root/runtimes/$rid/native/$bin"
          mkdir -p "$(dirname "$dest")"
          cp "target/$target/release/$bin" "$dest"

      - name: Upload native stage
        uses: actions/upload-artifact@v7
        with:
          name: native-stage-linux
          path: target/dist/artifacts/native-stage

  platform-linux-arm64:
    name: platform (linux arm64)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: quality
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true
          submodules: true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Setup Linux GUI dependencies
        uses: ./.github/actions/setup-linux-tool-deps

      - name: Stage native assets
        shell: bash
        run: |
          set -euo pipefail
          stage_root="target/dist/artifacts/native-stage"
          rid=linux-arm64
          target=aarch64-unknown-linux-gnu
          bin=dhara-sd
          cargo build -p dhara-sd --release --target "$target"
          dest="$stage_root/runtimes/$rid/native/$bin"
          mkdir -p "$(dirname "$dest")"
          cp "target/$target/release/$bin" "$dest"

      - name: Upload native stage
        uses: actions/upload-artifact@v7
        with:
          name: native-stage-linux-arm64
          path: target/dist/artifacts/native-stage

  platform-macos:
    name: platform (macos)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: quality
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true
          submodules: true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Stage native assets
        shell: bash
        run: |
          set -euo pipefail
          stage_root="target/dist/artifacts/native-stage"
          rid=osx-arm64
          target=aarch64-apple-darwin
          bin=dhara-sd
          cargo build -p dhara-sd --release --target "$target"
          dest="$stage_root/runtimes/$rid/native/$bin"
          mkdir -p "$(dirname "$dest")"
          cp "target/$target/release/$bin" "$dest"

      - name: Upload native stage
        uses: actions/upload-artifact@v7
        with:
          name: native-stage-macos
          path: target/dist/artifacts/native-stage

  nuget-package:
    name: NuGet package (linux)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: [platform-windows, platform-linux, platform-linux-arm64, platform-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true
          submodules: true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Setup Linux GUI dependencies
        uses: ./.github/actions/setup-linux-tool-deps

      - name: Download DROT
        uses: ./.github/actions/download-drot
        with:
          artifact_name: drot-linux-x64
          github_token: ${{ secrets.DROT_ARTIFACTS_TOKEN }}

      - name: Download native stages
        uses: actions/download-artifact@v8
        with:
          pattern: native-stage-*
          path: target/dist/artifacts/native-inputs
          merge-multiple: false

      - name: Merge native stages
        shell: bash
        run: |
          set -euo pipefail
          output="target/dist/artifacts/native-stage"
          rm -rf "$output"
          mkdir -p "$output/runtimes"
          for stage in \
            target/dist/artifacts/native-inputs/native-stage-windows \
            target/dist/artifacts/native-inputs/native-stage-linux \
            target/dist/artifacts/native-inputs/native-stage-linux-arm64 \
            target/dist/artifacts/native-inputs/native-stage-macos
          do
            if [ ! -d "$stage/runtimes" ]; then
              echo "::error::missing runtimes in $stage"
              exit 1
            fi
            for rid_dir in "$stage/runtimes"/*; do
              [ -d "$rid_dir" ] || continue
              rid="$(basename "$rid_dir")"
              mkdir -p "$output/runtimes/$rid"
              cp -a "$rid_dir/." "$output/runtimes/$rid/"
            done
          done

      - name: Pack NuGet package
        shell: bash
        run: |
          set -euo pipefail
          target/dist/drot -r "$GITHUB_WORKSPACE" --yes package pack \
            --native-stage target/dist/artifacts/native-stage

      - name: Write release metadata
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep -E '^\s*workspace\s*=' dhara.config.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          printf '{"version":"%s","commit":"%s"}\n' "$version" "${{ github.sha }}" > target/dist/artifacts/release-metadata.json

      - name: Upload release native stage
        uses: actions/upload-artifact@v7
        with:
          name: release-native-stage
          path: target/dist/artifacts/native-stage
          retention-days: 90

      - name: Upload release NuGet package
        uses: actions/upload-artifact@v7
        with:
          name: release-nuget-package
          path: |
            target/dist/output/nuget/*.nupkg
            target/dist/output/nuget/*.snupkg
            target/dist/output/nuget/*.symbols.nupkg
          retention-days: 90

      - name: Upload release metadata
        uses: actions/upload-artifact@v7
        with:
          name: release-metadata
          path: target/dist/artifacts/release-metadata.json
          retention-days: 90

  nuget-verify:
    name: NuGet verify (linux)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: nuget-package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true
          submodules: true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Download DROT
        uses: ./.github/actions/download-drot
        with:
          artifact_name: drot-linux-x64
          github_token: ${{ secrets.DROT_ARTIFACTS_TOKEN }}

      - name: Download merged native stage
        uses: actions/download-artifact@v8
        with:
          name: release-native-stage
          path: target/dist/artifacts/native-stage

      - name: Verify package
        shell: bash
        run: |
          set -euo pipefail
          target/dist/drot -r "$GITHUB_WORKSPACE" --yes verify package \
            --native-stage target/dist/artifacts/native-stage

          hash=$(
            {
              git ls-files 'tooling/dhara_tool'
              git ls-files 'Cargo.toml' 'Cargo.lock'
            } | sort -u | while read -r file; do
              [ -f "$file" ] && sha256_file "$file"
            done | sha256_file | awk '{print substr($1, 1, 16)}'
          )
          echo "hash=${hash}" >> "${GITHUB_OUTPUT}"

      - name: Restore dhara_tool cache
        id: tool-cache
        uses: actions/cache/restore@v4
        with:
          path: target/dist
          key: dhara-tool-${{ steps.tool-hash.outputs.hash }}-linux-x64

      - name: Setup Linux tool build dependencies
        if: steps.tool-cache.outputs.cache-hit != 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_tool_rebuild)
        uses: ./.github/actions/setup-linux-tool-deps

      - name: Build dhara_tool on cache miss
        if: steps.tool-cache.outputs.cache-hit != 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_tool_rebuild)
        run: cargo build -p dhara_tool --profile dist

      - name: Save dhara_tool cache
        if: steps.tool-cache.outputs.cache-hit != 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_tool_rebuild)
        uses: actions/cache/save@v4
        with:
          path: target/dist
          key: dhara-tool-${{ steps.tool-hash.outputs.hash }}-linux-x64

      - name: Rust tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p dhara_storage --all-features
          cargo test -p dhara_storage_dal
          cargo test -p dharastorage-ffi

      - name: Stage native assets
        shell: bash
        run: |
          set -euo pipefail
          stage_root="target/dist/artifacts/native-stage"
          rid=linux-x64
          target=x86_64-unknown-linux-gnu
          lib=libdharastorage.so
          cargo build -p dharastorage-ffi --release --target "$target"
          dest="$stage_root/runtimes/$rid/native/$lib"
          mkdir -p "$(dirname "$dest")"
          cp "target/$target/release/$lib" "$dest"

      - name: Upload native stage
        uses: actions/upload-artifact@v4
        with:
          name: native-stage-linux
          path: target/dist/artifacts/native-stage

  platform-linux-arm64:
    name: platform (linux arm64)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: quality
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache Cargo dependencies

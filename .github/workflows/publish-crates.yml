name: publish-crates

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate cargo release without publishing
        required: true
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

concurrency:
  group: publish-crates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-changes:
    name: detect cargo scope
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        if: github.event_name == 'push'
        id: filter
        with:
          filters: |
            cargo_scope:
              - 'core/dhara_storage/**'
              - 'core/dhara_storage_core/**'
              - 'dhara.config.toml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/publish-crates.yml'
      - name: Resolve scope
        id: check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=${{ steps.filter.outputs.cargo_scope }}" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: cargo release (linux)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    environment: release-cargo
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Setup Linux GUI dependencies
        uses: ./.github/actions/setup-linux-tool-deps

      - name: Install cargo-release
        run: cargo install cargo-release --version 1.1.2 --locked

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Authenticate (Trusted Publishing)
        id: crates-auth
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish crates
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.crates-auth.outputs.token }}
          FALLBACK_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          is_dry_run=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            is_dry_run=true
          fi

          is_duplicate_output() {
            grep -qiE \
              'already exists on|crate .+ already exists|version .+ is already uploaded|already uploaded' \
              <<<"$1"
          }

          run_release() {
            local token="$1"
            local label="$2"
            local out code
            local -a args=(
              release --workspace --isolated
              --tag-name 'v{{version}}' --no-confirm
            )
            if [ "$is_dry_run" = true ]; then
              args+=(--allow-branch '*' --no-verify)
            else
              args+=(--allow-branch main --execute)
            fi
            echo "Attempting cargo release via ${label}..."
            set +e
            out=$(CARGO_REGISTRY_TOKEN="$token" cargo "${args[@]}" 2>&1)
            code=$?
            set -e
            printf '%s\n' "$out"
            if [ "$code" -eq 0 ]; then
              echo "::notice::Cargo release succeeded via ${label}."
              return 0
            fi
            if is_duplicate_output "$out"; then
              echo "::notice::Crate version(s) already live on crates.io (${label}). Nothing further to publish."
              return 2
            fi
            echo "::warning::Cargo release via ${label} failed (exit ${code})."
            return 1
          }

          if [ "$is_dry_run" = true ]; then
            # Dry-run does not need registry credentials.
            args=(
              release --workspace --isolated
              --tag-name 'v{{version}}' --no-confirm
              --allow-branch '*' --no-verify
            )
            cargo "${args[@]}"
            exit 0
          fi

          if [ -n "${OIDC_TOKEN:-}" ]; then
            if run_release "$OIDC_TOKEN" "OIDC Trusted Publishing"; then
              exit 0
            else
              rc=$?
              if [ "$rc" -eq 2 ]; then
                exit 0
              fi
              echo "::warning::OIDC publish failed (Trusted Publishing may be misconfigured). Falling back to API token."
            fi
          else
            echo "::warning::OIDC auth did not produce a token. Falling back to API token."
          fi

          if [ -z "${FALLBACK_TOKEN:-}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not set on environment release-cargo; cannot fall back from OIDC."
            exit 1
          fi

          if run_release "$FALLBACK_TOKEN" "API token"; then
            exit 0
          else
            rc=$?
            if [ "$rc" -eq 2 ]; then
              exit 0
            fi
            echo "::error::Cargo release failed via API token."
            exit 1
          fi

# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # Maintain dependencies for Cargo (version updates → development)
  - package-ecosystem: "cargo"
    directory: "/"
    target-branch: "development"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    labels:
      - "dependencies"
    groups:
      cargo-dependencies:
        patterns:
          - "*"

  # Maintain dependencies for GitHub Actions (version updates → development)
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "development"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"
